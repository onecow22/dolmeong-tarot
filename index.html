.center{display:flex;justify-content:center;margin-top:22px;gap:10px;flex-wrap:wrap}
/* deck */
.table{position:relative;margin-top:18px}
.hint{text-align:center;font-family:"Jua";font-size:15px;min-height:24px;color:var(--cream)}
.deck{position:relative;height:0}
.deck .cb{position:absolute;bottom:30px;left:50%;width:var(--cw);transform-origin:50% 170%;cursor:pointer;padding:0;
 transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s,translate .2s}
.deck .cb:hover,.deck .cb:focus-visible{translate:0 -12px}
.deck.gathered .cb{transform:translateX(-50%) rotate(0) !important}
.card{aspect-ratio:3/5;border-radius:10px;position:relative}
.back{background:var(--back);border:3px solid var(--paper);box-shadow:0 6px 14px #0006;overflow:hidden}
.back svg{width:100%;height:100%;display:block}

.slot{display:flex;flex-direction:column;align-items:center;gap:8px}
.slot .pos{font-family:"Jua";font-size:clamp(13px,3.6vw,17px);text-align:center;line-height:1.3}
.flip{width:100%;perspective:1200px;cursor:pointer;background:none;border:0;padding:0}
.flip .inner{position:relative;width:100%;aspect-ratio:3/5;transition:transform .8s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.open .inner{transform:rotateY(180deg)}
.flip .card{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .face{transform:rotateY(180deg)}
.flip.rev .face .fwrap{transform:rotate(180deg)}
.empty{aspect-ratio:3/5;width:100%;border:2px dashed #f6ecdc55;border-radius:10px}
/* card face (피그마 Card/00~21) */
.face{background:var(--paper);color:var(--ink);box-shadow:0 6px 14px #0006;overflow:hidden;container-type:inline-size}
.fwrap{position:absolute;inset:3.3%;border:1.6px solid var(--ink);border-radius:7px;display:flex;flex-direction:column;align-items:center;padding:7% 0 6%;transition:transform .4s}
.fwrap::after{content:"";position:absolute;inset:2.2%;border:.8px solid var(--ink);border-radius:5px;pointer-events:none}
.num{font-family:"Jua";font-size:8.7cqw;line-height:1.3}
.fwrap svg{width:91%;flex:1}
.nm{font-family:"Jua";font-size:11cqw;line-height:1.15;text-align:center;white-space:nowrap}
.nm.long{font-size:8.5cqw}
.en{font-size:6cqw;opacity:.6;line-height:1.4;white-space:nowrap}

"마음을 무겁게 하던 일이 하나둘 풀린 한 해였어요. 알고 보니 생각보다 별일 아니었던 일도 있었을 거예요. 달빛 아래 흐릿하던 길이 조금씩 선명해지면서 마음도 가벼워졌죠."
],
[
"2026년은 환하게 빛난 해였어요. 기쁜 소식이 있었고, 노력한 일이 성과로 이어졌죠. 하는 일들은 잘 풀리고 축하 연락을 주고받는 일이 유난히 많았겠어요.",
"태양 카드는 성공과 기쁨의 카드지만, 2026년에는 그 해가 잠시 구름에 가려 있었네요. 좋은 일이 있었는데도 마음껏 기뻐하지 못했고, 성과는 늦게 나오거나 기대보다 작게 느껴졌을 거예요. 칭찬을 들어도 ‘아직 멀었다’며 넘기진 않았나요?"
],
[
"죽어있던 사람이 깨어나는 심판 카드는 오래 기다리던 소식이 들려오는 카드예요. 오지 않을 것 같던 소식이 왔거나, 재회한 인연이 있던 벅찬 한 해를 보냈어요.",
"지난 일에 대한 후회가 발목을 잡았던 한 해였네요. 다시 시작하고 싶었지만 용기가 나지 않아 결정을 미뤘을 거예요. 다시 해 볼까 싶어 찾아본 자료가 아직 저장돼 있다면, 2027년에는 꺼내 볼 차례예요."
],
[
"하나의 여정을 마무리한 해예요. 오래 해 온 일의 마지막 단계를 지나, 그 결과를 손에 쥐었어요. 마무리한 그날은 아마 오래 기억날 거예요.",
"세계 카드는 완성을 뜻하지만, 2026년에는 마지막 한 조각이 채워지지 않은 한 해였네요. 거의 다 된 일이 마지막 단계에서 늦어졌고, 끝내 마무리를 짓지 못했을 거예요. 남은 한 조각만 채우면 완성이니, 너무 아쉬워하지 않아도 돼요."

function lines(ctx,text,maxW){
 const out=[];
 for(const para of String(text).trim().split('\n')){
  let line='';
  for(const word of para.split(/\s+/).filter(Boolean)){
   const t=line?line+' '+word:word;
   if(ctx.measureText(t).width<=maxW){line=t;continue;}
   if(line) out.push(line);
   if(ctx.measureText(word).width<=maxW){line=word;continue;}
   line=''; for(const ch of word){ if(ctx.measureText(line+ch).width>maxW){out.push(line);line=ch;} else line+=ch; }

}

   const cv=await makeImage(k); const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
   const url=URL.createObjectURL(blob); shots[k]={blob,url,file:new File([blob],fileName(k),{type:'image/png'})};
   $('previews').querySelector(`[data-k="${k}"] .ph`).innerHTML=`<img src="${url}" alt="2027 ${SHORT[k]} 결과 이미지">`;
  }catch(e){ console.error(e); }
 }
}
const mobile=()=>matchMedia('(pointer:coarse)').matches;
const canShareFiles=files=>{try{return !!(navigator.canShare&&navigator.canShare({files}))}catch(e){return false}};
function download(k){ const a=document.createElement('a'); a.href=shots[k].url; a.download=fileName(k); document.body.appendChild(a); a.click(); a.remove(); }
function openModal(html){$('modalBox').innerHTML=html;$('modal').hidden=false;}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('.close'))$('modal').hidden=true;});
$('previews').addEventListener('click',e=>{
 const b=e.target.closest('.pv'); if(!b) return; const k=+b.dataset.k; if(!shots[k]) return;
 track('preview_open',{index:k+1});
 const share=canShareFiles([shots[k].file]);
 openModal(`<img src="${shots[k].url}" alt="2027 ${SHORT[k]} 결과 이미지"><p>${mobile()?'이미지를 길게 눌러 사진첩에 저장할 수 있어요.':'다운로드를 눌러 저장하세요.'}</p>
  <div class="acts"><button class="btn" id="dlOne">다운로드</button>${share?'<button class="btn line" id="shOne">공유</button>':''}<button class="btn line close">닫기</button></div>`);
 $('dlOne').onclick=()=>{download(k);track('save_image',{count:1,index:k+1});};
 if(share) $('shOne').onclick=async()=>{try{await navigator.share({files:[shots[k].file],title:'2027년 돌멍 타로 운세'});track('share',{method:'image',count:1});}catch(e){}};
});
$('saveAll').onclick=async()=>{
 if(shots.length<3||shots.some(x=>!x)){ toast('이미지를 만들고 있어요. 잠시만요'); return; }
 track('save_image',{count:3});
 const files=shots.map(x=>x.file);
 if(mobile()&&canShareFiles(files)){ try{await navigator.share({files}); return;}catch(e){ if(e.name==='AbortError') return; } }
 for(let k=0;k<3;k++){ download(k); await new Promise(r=>setTimeout(r,400)); }
 toast('이미지 3장을 저장했어요');
};
function promoText(withUrl){
 const names=picks[1].map(p=>CARDS[p.card].ko).join(' · ');
 return `🪨 돌멍이로 뽑아보는 2027년 운세
나의 2027년의 타로 카드는 ${names} 인데,
너의 2027년은 어떤 카드일까?
카드 6장으로 2026년을 돌아보고 2027년을 미리 대비해봐!👇` + (withUrl ? '\n' + location.href.split(/[?#]/)[0] : '');
}
function resultText(){ return promoText(true); }
$('copyTxt').onclick=async()=>{
 track('copy_result'); const t=resultText();
 try{await navigator.clipboard.writeText(t);toast('결과를 복사했어요');}
 catch(e){openModal(`<p>아래 내용을 길게 눌러 복사해 주세요.</p><textarea>${esc(t)}</textarea><div class="acts"><button class="btn line close">닫기</button></div>`);}
};
$('shareBtn').onclick=async()=>{
 const url=location.href.split(/[?#]/)[0];
 const text=promoText(false);
 const files=shots.filter(Boolean).map(x=>x.file);
 if(navigator.share){
  try{
   if(files.length===3&&canShareFiles(files)) await navigator.share({files,title:'2027년 돌멍 타로 운세',text:text+'\n'+url});
   else await navigator.share({title:'2027년 돌멍 타로 운세',text,url});
   track('share',{method:'native'}); return;
  }catch(e){ if(e.name==='AbortError') return; }
 }
 try{await navigator.clipboard.writeText(url);toast('링크를 복사했어요. 친구에게 보내보세요');track('share',{method:'copy_link'});}
 catch(e){openModal(`<p>이 주소를 복사해 공유해 주세요.</p><p style="word-break:break-all;font-size:15px;color:#1b1918">${url}</p><div class="acts"><button class="btn line close">닫기</button></div>`);}
};
$('restart').onclick=()=>{track('restart'); init(); window.scrollTo({top:0,behavior:'smooth'});};

/* ---------- 시작 ---------- */
function bind(s){
 $('sec'+s).addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('.shuffle')) shuffle(s);
  else if(t.closest('.again')){ track('draw_again',{step:s===0?'2026':'2027'}); if(s===0){ $('sec1').hidden=true; picks[1]=[]; $('sec2').hidden=true;} shuffle(s); }
  else if(t.closest('.reveal')) revealAll(s);
  else if(t.closest('.go27')) startStep2();
  else if(t.closest('.goShare')) startShare();
  else { const cb=t.closest('.cb'); if(cb) return pick(s,cb); const f=t.closest('.flip'); if(f) openCard(s,+f.dataset.k); }
 });
}
function startStep2(){ track('start_2027'); const s1=$('sec1'); s1.hidden=false; s1.innerHTML=sectionHTML(1); renderSlots(1); cur=1; setTabs(); q(0,'.acts').hidden=true; q(0,'.next').hidden=true; s1.scrollIntoView({behavior:'smooth'}); }
function startShare(){ track('share_cta'); $('sec2').hidden=false; cur=2; setTabs(); q(1,'.acts').hidden=true; q(1,'.next').hidden=true; $('sec2').scrollIntoView({behavior:'smooth'}); buildShots(); }
function goStep(i){
 if(i===0){ $('sec0').scrollIntoView({behavior:'smooth'}); return; }
 if(picks[0].length<3 || $('sec0').querySelectorAll('.flip.open').length<3){ toast('2026년 카드 3장을 먼저 뒤집어 주세요'); $('sec0').scrollIntoView({behavior:'smooth'}); return; }
 if($('sec1').hidden) startStep2(); else $('sec1').scrollIntoView({behavior:'smooth'});
}
[0,1].forEach(i=>$('st'+i).onclick=()=>goStep(i));
function init(){
 cur=0; picks=[[],[]]; drawCount=[0,0];
 $('sec0').innerHTML=sectionHTML(0); renderSlots(0);
 $('sec1').hidden=true; $('sec1').innerHTML=''; $('sec2').hidden=true; setTabs();
}
bind(0); bind(1);
new ResizeObserver(()=>{layout(0); if(!$('sec1').hidden) layout(1);}).observe(document.body);
init();
}
</script>
</body>
